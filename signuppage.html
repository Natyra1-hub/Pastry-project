<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="signuppage.css">
</head>
<body>
    <div id="signupPage" class="signup-page">
    <div class="signup-container">

        <div class="signup-image">
            <img src="homepage/52fff62a917d557c29429ee43f639ce2.jpg" alt="signup Image">
        </div>

        <div class="signup-card">
            <h2>Sign Up</h2>

            <form onsubmit="return validateSignup()">
            <input type="email" id="email" placeholder="Email">
            <input type="text" id="username" placeholder="Username">
            <input type="date" id="dob" placeholder="Date of Birth">
            <input type="password" id="password" placeholder="Password">

             <p id="errorMsg" style="color:red; font-size:14px;"></p>

            <button type="submit">Sign Up</button>
        </form>

            <div class="links">
                <a href="loginpage.html">Already have an account? Login</a>
            </div>
        </div>
    </div>
</div>

<script src="signuppage.js"></script>
</body>
</html>
